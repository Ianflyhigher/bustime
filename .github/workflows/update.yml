name: 시간표 자동 갱신
on:
  schedule:
    - cron: '41 22 * * 0'   # 매주 월요일 07:41 (한국시간)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 공식 시간표 받아오기
        run: LIMO_OUT=/tmp/frag.html python3 update/update.py
      - name: 바뀐 게 있으면 페이지 다시 만들고 올리기
        run: |
          if git diff --quiet update/data.json; then echo "변경 없음"; exit 0; fi
          python3 update/build_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/data.json index.html
          git commit -m "시간표 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
